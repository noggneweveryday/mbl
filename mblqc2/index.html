<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>机折车间质检分析</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f0f2f5;
            padding: 20px;
            min-height: 100vh;
        }
        .screen {
            max-width: 1500px;
            margin: 0 auto;
        }
        .topbar {
            background: #fff;
            border-radius: 16px;
            padding: 20px 28px;
            margin-bottom: 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .topbar h1 {
            font-size: 24px;
            color: #1a1a2e;
        }
        .topbar .refresh-btn {
            padding: 8px 24px;
            background: #4f6ef7;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
        }
        .topbar .refresh-btn:hover {
            background: #3a56d4;
        }
        .topbar .refresh-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .topbar .status {
            font-size: 13px;
            color: #999;
            margin-right: 12px;
        }
        .topbar .status.online {
            color: #22b573;
        }
        .topbar .status.offline {
            color: #f55753;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: #fff;
            border-radius: 12px;
            padding: 16px 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            border: 1px solid #eef0f5;
        }
        .stat-card .label {
            font-size: 13px;
            color: #999;
        }
        .stat-card .value {
            font-size: 28px;
            font-weight: 700;
            color: #1a1a2e;
            margin-top: 2px;
        }
        .stat-card .value.green {
            color: #22b573;
        }
        .stat-card .value.red {
            color: #f55753;
        }
        .stat-card .value.blue {
            color: #4f6ef7;
        }
        .row-2col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            border: 1px solid #eef0f5;
        }
        .card .card-title {
            font-size: 15px;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 12px;
        }
        .card .card-title .badge {
            background: #4f6ef7;
            color: #fff;
            font-size: 12px;
            border-radius: 20px;
            padding: 0 12px;
            margin-left: 8px;
            font-weight: 400;
        }
        .card .card-title .sort-hint {
            color: #999;
            font-size: 12px;
            font-weight: 400;
            margin-left: 8px;
        }
        .chart-box {
            width: 100%;
            height: 280px;
        }
        .table-wrap {
            overflow-x: auto;
            max-height: 400px;
            overflow-y: auto;
        }
        .table-wrap-full {
            overflow-x: auto;
            max-height: 500px;
            overflow-y: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        table th {
            background: #f7f8fc;
            padding: 10px 12px;
            text-align: left;
            border-bottom: 2px solid #e8e8e8;
            white-space: nowrap;
            font-weight: 600;
            color: #555;
            position: sticky;
            top: 0;
            z-index: 2;
        }
        table td {
            padding: 8px 12px;
            border-bottom: 1px solid #f0f0f0;
        }
        table tr:hover td {
            background: #fafbff;
        }
        .tag {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .tag.pass {
            background: #e6f7ed;
            color: #22b573;
        }
        .tag.fail {
            background: #ffe8e8;
            color: #f55753;
        }
        .tag.defect {
            background: #fff3e0;
            color: #e67e22;
            font-weight: 400;
            margin: 1px 4px 1px 0;
            display: inline-block;
            padding: 1px 10px;
            border-radius: 12px;
            font-size: 12px;
        }
        .empty-state {
            text-align: center;
            color: #bbb;
            padding: 40px 0;
            font-size: 15px;
        }
        .footer {
            text-align: center;
            color: #ccc;
            font-size: 12px;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #eee;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .search-box input {
            padding: 8px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            flex: 1;
            min-width: 200px;
            outline: none;
            transition: 0.3s;
        }
        .search-box input:focus {
            border-color: #4f6ef7;
            box-shadow: 0 0 0 3px rgba(79, 110, 247, 0.1);
        }
        .search-box .search-hint {
            color: #999;
            font-size: 13px;
        }
        .search-box .clear-btn {
            padding: 6px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f5f5f5;
            cursor: pointer;
            font-size: 13px;
            color: #666;
            transition: 0.3s;
        }
        .search-box .clear-btn:hover {
            background: #eee;
        }
        @media (max-width: 1000px) {
            .row-2col {
                grid-template-columns: 1fr;
            }
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 600px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
            .search-box {
                flex-direction: column;
                align-items: stretch;
            }
            .topbar {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="screen">
        <header class="topbar">
            <div>
                <h1>🔧 机折车间质检分析</h1>
            </div>
            <div>
                <span class="status" id="statusText">● 就绪</span>
                <button class="refresh-btn" id="refreshBtn">🔄 刷新数据</button>
            </div>
        </header>

        <div class="stats" id="statsArea">
            <div class="stat-card"><div class="label">总记录数</div><div class="value" id="totalCount">-</div></div>
            <div class="stat-card"><div class="label">总订单数</div><div class="value blue" id="orderCount">-</div></div>
            <div class="stat-card"><div class="label">合格记录</div><div class="value green" id="passCount">-</div></div>
            <div class="stat-card"><div class="label">返工记录</div><div class="value red" id="failCount">-</div></div>
        </div>

        <div class="row-2col">
            <div class="card">
                <div class="card-title">📊 缺陷类型分布 <span class="badge">动态</span></div>
                <div class="chart-box" id="chartDefect"></div>
            </div>
            <div class="card">
                <div class="card-title">📊 外观疵点明细 <span class="badge">动态</span></div>
                <div class="chart-box" id="chartAppearance"></div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">❌ 返工明细 <span class="badge">共 <span id="failCountBadge">0</span> 条</span><span class="sort-hint">↓ 最新在前</span></div>
            <div class="search-box">
                <input type="text" id="failSearchInput" placeholder="搜索订单号 / 工号 / 机台号..." />
                <button class="clear-btn" id="failClearBtn">清除</button>
                <span class="search-hint" id="failResultHint">共 0 条</span>
            </div>
            <div class="table-wrap" id="failTable">
                <div class="empty-state">点击「刷新数据」加载</div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">📋 各订单统计 <span class="badge">按订单</span><span class="sort-hint">↓ 最新在前</span></div>
            <div class="search-box">
                <input type="text" id="orderSearchInput" placeholder="搜索订单号..." />
                <button class="clear-btn" id="orderClearBtn">清除</button>
                <span class="search-hint" id="orderResultHint">共 0 个订单</span>
            </div>
            <div class="table-wrap-full" id="orderTable">
                <div class="empty-state">点击「刷新数据」加载</div>
            </div>
        </div>

        <div class="footer">点击「刷新数据」拉取最新数据</div>
    </div>

    <script>
        // ================================================================
        // 配置区
        // ================================================================

        const API_KEY = '37x5cCwMcDtqmnuuKQe2Xfakg7Ez5GcM';
        const API_URL = 'https://shurui.online-office.net/openapi/v1/app/564ba6f1503200052f825d8c/entry/54225d875ae1d7e649fbaae2/data';

        // ================================================================
        // DOM 引用
        // ================================================================

        const el = {
            total: document.getElementById('totalCount'),
            orderCount: document.getElementById('orderCount'),
            pass: document.getElementById('passCount'),
            fail: document.getElementById('failCount'),
            failBadge: document.getElementById('failCountBadge'),
            chartDefect: document.getElementById('chartDefect'),
            chartAppearance: document.getElementById('chartAppearance'),
            failTable: document.getElementById('failTable'),
            orderTable: document.getElementById('orderTable'),
            failSearch: document.getElementById('failSearchInput'),
            failClear: document.getElementById('failClearBtn'),
            failHint: document.getElementById('failResultHint'),
            orderSearch: document.getElementById('orderSearchInput'),
            orderClear: document.getElementById('orderClearBtn'),
            orderHint: document.getElementById('orderResultHint'),
            refreshBtn: document.getElementById('refreshBtn'),
            statusText: document.getElementById('statusText')
        };

        let cachedFailList = [];
        let cachedOrderList = [];
        let isLoading = false;

        // ================================================================
        // API 请求（分页拉取全部数据）
        // ================================================================

        async function fetchAllRecords() {
            let allData = [];
            let skip = 0;
            const limit = 200;

            while (true) {
                const body = {
                    limit: limit,
                    skip: skip,
                    sort: {
                        '_widget_1788053165033': 'desc'
                    }
                };

                let success = false;
                let list = [];

                const attempts = [
                    { headers: { 'Content-Type': 'application/json', 'x-api-key': API_KEY } },
                    { headers: { 'Content-Type': 'application/json', 'api-key': API_KEY } },
                    { headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${API_KEY}` } }
                ];

                for (const attempt of attempts) {
                    try {
                        const response = await fetch(API_URL, {
                            method: 'POST',
                            headers: attempt.headers,
                            body: JSON.stringify(body)
                        });

                        if (!response.ok) {
                            throw new Error(`HTTP ${response.status}`);
                        }

                        const result = await response.json();
                        list = Array.isArray(result.data) ? result.data : [];
                        success = true;
                        break;
                    } catch (error) {
                        // 静默处理
                    }
                }

                if (!success) {
                    throw new Error('请求失败');
                }

                if (list.length === 0) {
                    break;
                }

                allData = allData.concat(list);
                skip += limit;

                if (list.length < limit) {
                    break;
                }

                if (allData.length > 10000) {
                    break;
                }
            }

            return allData;
        }

        // ================================================================
        // 解析数据
        // ================================================================

        function parseRecords(records) {
            const results = [];

            records.forEach((order) => {
                const orderId = String(order['_widget_1788053163476'] || '').trim();
                const orderDate = String(order['_widget_1788053165033'] || '').trim();
                const worker = String(order['_widget_1788053163493'] || '').trim();
                const machine = String(order['_widget_1788053163510'] || '').trim();

                if (!worker) return;

                const subRows = order['_widget_1788053163527'] || [];
                if (!Array.isArray(subRows) || subRows.length === 0) {
                    results.push({
                        order: orderId,
                        date: orderDate,
                        worker: worker,
                        machine: machine,
                        seam: '无',
                        appearance: '无',
                        result: '合格',
                        isFail: false,
                        defects: []
                    });
                    return;
                }

                subRows.forEach(row => {
                    const seam = String(row['_widget_1788053164511'] || '').trim();
                    const appearance = String(row['_widget_1788053163622'] || '').trim();
                    const result = String(row['_widget_1788057631693'] || '').trim();

                    const isFail = result === '返工';

                    const defects = [];
                    if (seam && seam !== '无' && seam !== '' && seam !== '0') {
                        defects.push({ name: '掉缝', detail: seam });
                    }
                    if (appearance && appearance !== '无' && appearance !== '') {
                        defects.push({ name: '外观疵点', detail: appearance });
                    }

                    results.push({
                        order: orderId,
                        date: orderDate,
                        worker: worker,
                        machine: machine,
                        seam: seam,
                        appearance: appearance,
                        result: result,
                        isFail: isFail,
                        defects: defects
                    });
                });
            });

            return results;
        }

        // ================================================================
        // 加载数据
        // ================================================================

        async function loadData() {
            if (isLoading) return;
            isLoading = true;
            el.refreshBtn.disabled = true;
            el.refreshBtn.textContent = '⏳ 加载中...';
            el.statusText.textContent = '● 加载中...';
            el.statusText.className = 'status';

            try {
                const records = await fetchAllRecords();

                if (records.length === 0) {
                    el.statusText.textContent = '● 无数据';
                    el.statusText.className = 'status offline';
                    el.failTable.innerHTML = '<div class="empty-state">⚠️ 无数据</div>';
                    return;
                }

                const parsed = parseRecords(records);

                if (parsed.length === 0) {
                    el.statusText.textContent = '● 解析后无有效数据';
                    el.statusText.className = 'status offline';
                    el.failTable.innerHTML = '<div class="empty-state">⚠️ 解析后无有效数据</div>';
                    return;
                }

                const valid = parsed.filter(r => r.worker);
                const failList = valid.filter(r => r.isFail);
                const passList = valid.filter(r => !r.isFail);

                // 按订单分组
                const orderMap = {};
                valid.forEach(item => {
                    const key = item.order || '未知';
                    if (!orderMap[key]) {
                        orderMap[key] = { order: key, date: item.date, total: 0, fail: 0 };
                    }
                    orderMap[key].total++;
                    if (item.isFail) orderMap[key].fail++;
                });
                const orderList = Object.values(orderMap);
                orderList.sort((a, b) => b.date.localeCompare(a.date));

                cachedFailList = failList;
                cachedOrderList = orderList;

                const total = valid.length;
                const passCount = passList.length;
                const failCount = failList.length;

                el.total.textContent = total;
                el.orderCount.textContent = orderList.length;
                el.pass.textContent = passCount;
                el.fail.textContent = failCount;
                el.failBadge.textContent = failCount;

                renderCharts(failList);
                renderFailTable(failList, '');
                renderOrderTable(orderList, '');

                el.statusText.textContent = `● 已加载 ${total} 条记录`;
                el.statusText.className = 'status online';

            } catch (error) {
                console.error('加载失败:', error);
                el.statusText.textContent = '● ' + error.message;
                el.statusText.className = 'status offline';
                el.failTable.innerHTML = `<div class="empty-state">❌ ${error.message}</div>`;
                el.orderTable.innerHTML = `<div class="empty-state">❌ ${error.message}</div>`;
            } finally {
                isLoading = false;
                el.refreshBtn.disabled = false;
                el.refreshBtn.textContent = '🔄 刷新数据';
            }
        }

        // ================================================================
        // 渲染函数
        // ================================================================

        function renderCharts(failList) {
            const defectMap = {};
            failList.forEach(item => {
                item.defects.forEach(d => {
                    defectMap[d.name] = (defectMap[d.name] || 0) + 1;
                });
            });

            const chart1 = echarts.init(el.chartDefect);
            const names1 = Object.keys(defectMap);
            const values1 = Object.values(defectMap);

            if (names1.length === 0) {
                chart1.setOption({
                    title: { text: '✅ 全部合格，无缺陷', left: 'center', top: 'center', textStyle: { color: '#999',
                            fontSize: 16, fontWeight: 400 } },
                    xAxis: { show: false },
                    yAxis: { show: false },
                    series: [{ type: 'bar', data: [] }]
                });
            } else {
                chart1.setOption({
                    tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
                    grid: { left: '8%', right: '8%', top: '10%', bottom: '18%' },
                    xAxis: { type: 'category', data: names1, axisLabel: { fontSize: 13, fontWeight: 600 } },
                    yAxis: { type: 'value', minInterval: 1, name: '出现次数', splitLine: { lineStyle: { color: '#f0f0f0',
                                type: 'dashed' } } },
                    series: [{
                        type: 'bar',
                        data: values1,
                        barWidth: '50%',
                        itemStyle: {
                            color: function(params) {
                                const colors = ['#f55753', '#f5a623', '#4f6ef7', '#22b573', '#8b5cf6'];
                                return colors[params.dataIndex % colors.length];
                            },
                            borderRadius: [4, 4, 0, 0]
                        },
                        label: { show: true, position: 'top', fontSize: 14, fontWeight: 600 }
                    }]
                });
            }
            window.addEventListener('resize', () => chart1.resize());

            const appMap = {};
            failList.forEach(item => {
                if (item.appearance && item.appearance !== '无' && item.appearance !== '') {
                    appMap[item.appearance] = (appMap[item.appearance] || 0) + 1;
                }
            });

            const chart2 = echarts.init(el.chartAppearance);
            const sorted = Object.entries(appMap).sort((a, b) => b[1] - a[1]);
            const names2 = sorted.map(item => item[0]);
            const values2 = sorted.map(item => item[1]);

            if (names2.length === 0) {
                chart2.setOption({
                    title: { text: '✅ 无外观疵点', left: 'center', top: 'center', textStyle: { color: '#999',
                            fontSize: 16, fontWeight: 400 } },
                    xAxis: { show: false },
                    yAxis: { show: false },
                    series: [{ type: 'bar', data: [] }]
                });
            } else {
                const needRotate = names2.length > 5;
                chart2.setOption({
                    tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
                    grid: { left: '8%', right: '8%', top: '10%', bottom: needRotate ? '30%' : '18%' },
                    xAxis: {
                        type: 'category',
                        data: names2,
                        axisLabel: {
                            fontSize: 11,
                            interval: 0,
                            rotate: needRotate ? 30 : 0,
                            formatter: function(val) {
                                if (val.length > 12) return val.substring(0, 10) + '…';
                                return val;
                            }
                        }
                    },
                    yAxis: { type: 'value', minInterval: 1, name: '出现次数', splitLine: { lineStyle: { color: '#f0f0f0',
                                type: 'dashed' } } },
                    series: [{
                        type: 'bar',
                        data: values2,
                        barWidth: '40%',
                        itemStyle: {
                            color: function(params) {
                                const colors = ['#8b5cf6', '#4f6ef7', '#f5a623', '#22b573', '#f55753',
                                    '#e67e22', '#1abc9c', '#3498db'
                                ];
                                return colors[params.dataIndex % colors.length];
                            },
                            borderRadius: [4, 4, 0, 0]
                        },
                        label: { show: true, position: 'top', fontSize: 13, fontWeight: 600 }
                    }]
                });
            }
            window.addEventListener('resize', () => chart2.resize());
        }

        function renderFailTable(failList, keyword) {
            if (failList.length === 0) {
                el.failTable.innerHTML = '<div class="empty-state">✅ 全部合格，无返工</div>';
                el.failHint.textContent = '共 0 条';
                return;
            }

            const kw = keyword.trim().toLowerCase();
            let filtered = failList;
            if (kw) {
                filtered = failList.filter(item =>
                    item.order.toLowerCase().includes(kw) ||
                    item.worker.toLowerCase().includes(kw) ||
                    item.machine.toLowerCase().includes(kw)
                );
            }
            filtered.sort((a, b) => b.date.localeCompare(a.date));
            el.failHint.textContent = `共 ${filtered.length} 条`;

            if (filtered.length === 0) {
                el.failTable.innerHTML = `<div class="empty-state">🔍 未找到匹配 "${keyword}" 的记录</div>`;
                return;
            }

            let html =
                `<table><thead><tr><th>检验日期</th><th>订单号</th><th>工号</th><th>机台号</th><th>掉缝</th><th>外观疵点</th><th>处理结果</th></tr></thead><tbody>`;
            filtered.forEach(item => {
                const seamDisplay = item.seam !== '无' && item.seam !== '' ? `<span class="tag defect">${item.seam}</span>` :
                    '无';
                const appDisplay = item.appearance !== '无' && item.appearance !== '' ?
                    `<span class="tag defect">${item.appearance}</span>` : '无';
                html += `<tr>
                    <td>${item.date || '-'}</td>
                    <td>${item.order || '-'}</td>
                    <td><strong>${item.worker || '-'}</strong></td>
                    <td>${item.machine || '-'}</td>
                    <td>${seamDisplay}</td>
                    <td>${appDisplay}</td>
                    <td><span class="tag fail">返工</span></td>
                </tr>`;
            });
            html += `</tbody></table>`;
            el.failTable.innerHTML = html;
        }

        function renderOrderTable(orderList, keyword) {
            if (orderList.length === 0) {
                el.orderTable.innerHTML = '<div class="empty-state">暂无数据</div>';
                el.orderHint.textContent = '共 0 个订单';
                return;
            }

            const kw = keyword.trim().toLowerCase();
            let filtered = orderList;
            if (kw) {
                filtered = orderList.filter(item => item.order.toLowerCase().includes(kw));
            }
            el.orderHint.textContent = `共 ${filtered.length} 个订单`;

            if (filtered.length === 0) {
                el.orderTable.innerHTML = `<div class="empty-state">🔍 未找到匹配 "${keyword}" 的订单</div>`;
                return;
            }

            let html =
                `<table><thead><tr><th>订单号</th><th>最新日期</th><th>总记录数</th><th>返工数</th><th>状态</th></tr></thead><tbody>`;
            filtered.forEach(item => {
                const status = item.fail === 0 ? '✅ 全部合格' : `⚠️ ${item.fail}次返工`;
                html += `<tr>
                    <td><strong>${item.order}</strong></td>
                    <td>${item.date || '-'}</td>
                    <td>${item.total}</td>
                    <td style="color:${item.fail > 0 ? '#f55753' : '#22b573'}">${item.fail}</td>
                    <td>${status}</td>
                </tr>`;
            });
            html += `</tbody></table>`;
            el.orderTable.innerHTML = html;
        }

        // ================================================================
        // 搜索事件
        // ================================================================

        el.failSearch.addEventListener('input', () => renderFailTable(cachedFailList, el.failSearch.value));
        el.failClear.addEventListener('click', () => { el.failSearch.value = '';
            renderFailTable(cachedFailList, ''); });
        el.orderSearch.addEventListener('input', () => renderOrderTable(cachedOrderList, el.orderSearch.value));
        el.orderClear.addEventListener('click', () => { el.orderSearch.value = '';
            renderOrderTable(cachedOrderList, ''); });
        el.refreshBtn.addEventListener('click', loadData);

        // ================================================================
        // 启动
        // ================================================================

        loadData();
    </script>

</body>
</html>
